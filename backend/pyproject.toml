[build-system]
requires = ["setuptools==75.6.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "toolshed-hire-backend"
version = "0.2.0"
description = "Toolshed Hire rental system backend, FastAPI and PostgreSQL walking skeleton"
readme = "README.md"
# Cloud Run and CI both run 3.12. The upper bound is left open so a developer
# on 3.13 is not blocked, but 3.12 is the version the deployment image pins.
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
authors = [{ name = "Teon Kleynhans" }]

# Every version is pinned exactly. An unpinned dependency is an unreviewed
# change that arrives on the next clean install.
dependencies = [
    "fastapi==0.142.2",
    # FastAPI only sets a floor for Starlette. I pin it so the version that
    # serves requests is one I chose, and so the audit sees a fixed target.
    "starlette==1.7.0",
    "uvicorn[standard]==0.34.0",
    "sqlmodel==0.0.22",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "pyjwt==2.15.1",
    "passlib[bcrypt]==1.7.4",
    # passlib 1.7.4 reads bcrypt.__about__, which bcrypt 4.1 removed. 4.0.1 is
    # the last release passlib can introspect without emitting a spurious
    # version warning on every hash call.
    "bcrypt==4.0.1",
    # The HTTP client behind the Resend adapter. It was already pinned for the
    # test client, so the running application gains no new package.
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
    # Coverage for the gated run, the layer contract and the dependency audit.
    # None of the three is imported by the application.
    "pytest-cov==7.1.0",
    "import-linter==2.15",
    "pip-audit==2.10.1",
]

# Only what the running application imports is packaged. seed.py, seed_data,
# seeding and scripts are tools I run from this directory against a database.
# They are linted by `ruff check .` like everything else here, and they are
# left out of the list below and out of the image on purpose.
[tool.setuptools]
packages = [
    "app",
    "app.api",
    "app.api.routers",
    "app.application",
    "app.application.availability",
    "app.application.booking",
    "app.application.catalogue",
    "app.application.hire",
    "app.application.identity",
    "app.application.money",
    "app.application.notification",
    "app.domain",
    "app.domain.policies",
    "app.domain.states",
    "app.infrastructure",
    "app.infrastructure.models",
    "app.infrastructure.notification",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]
# --strict-markers turns a misspelled marker into a failure rather than a test
# that silently stops being selected by `-m postgres` and silently starts being
# selected by `-m "not postgres"`, which is the worst of both.
addopts = ["--strict-markers"]
markers = [
    "postgres: requires a real PostgreSQL reached through DATABASE_URL. The pipeline runs these in a separate job, so every test without this marker must pass with no database at all.",
]

# Coverage is measured over the two layers that hold the business rules. The
# routers and the infrastructure are exercised by the API and integration tests,
# but a percentage over them would mostly count framework wiring.
#
# I keep --cov out of addopts on purpose. The fast run without PostgreSQL
# deselects the integration tests, so it has to pass or fail on its tests alone
# and must not be gated by a threshold measured over part of the suite. The
# gated command is
# `pytest tests --cov --cov-report=term-missing --cov-report=xml`, and I run it
# with a real PostgreSQL behind DATABASE_URL.
[tool.coverage.run]
source = ["app/domain", "app/application"]

[tool.coverage.report]
fail_under = 70
show_missing = true

# The layer contract, checked by `lint-imports` from this directory. The
# documented rule is that dependencies point inward only. The domain imports
# nothing from the other layers, the application layer imports the domain and
# nothing else, and nothing below the API reaches up into it.
#
# include_external_packages lets a contract name a third party package, which
# the last contract needs.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The domain layer imports nothing from the other layers"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.application", "app.infrastructure", "app.api"]

[[tool.importlinter.contracts]]
name = "The application layer does not import the API layer"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = ["app.api"]

# The use cases depend on ports and the infrastructure layer implements them.
# The API layer is the composition root that puts the two together, so it is
# the only layer allowed to import both.
[[tool.importlinter.contracts]]
name = "The application layer does not import the infrastructure layer"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = ["app.infrastructure"]

[[tool.importlinter.contracts]]
name = "The infrastructure layer does not import the API layer"
type = "forbidden"
source_modules = ["app.infrastructure"]
forbidden_modules = ["app.api"]

# The two inner layers hold rules and orchestration, and both are tested with
# no database and no network. A framework or a driver imported into either one
# would end that, however it arrived. allow_indirect_imports keeps the contract
# to what these two layers import themselves.
[[tool.importlinter.contracts]]
name = "The domain and application layers import no framework and no driver"
type = "forbidden"
source_modules = ["app.domain", "app.application"]
forbidden_modules = ["sqlalchemy", "sqlmodel", "fastapi", "starlette", "pydantic", "httpx", "psycopg"]
allow_indirect_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# S608 flags SQL assembled from strings, which is how an injection gets written.
# C901 fails a function whose cyclomatic complexity passes the limit below.
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ANN", "D", "S608", "C901"]
# D203 and D213 conflict with the docstring style used throughout.
# N818 is ignored deliberately. Several domain errors are named in the
# vocabulary of the business, ValidationFailure and NotFound for example, and an
# Error suffix on every one of them would make the call sites read worse, not
# better. The ones the design document names carry the names it gives them.
# UP042 is ignored because the enumerations inherit str and Enum rather than
# StrEnum, which keeps `.value` the explicit way a stored value is read.
ignore = ["D203", "D213", "N818", "UP042"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["D103", "ANN"]
# A test's name is its documentation. Every test in the suite is named for the
# behaviour it protects, for example
# `test_a_hire_ending_on_the_twelfth_does_not_overlap_one_starting_on_the_twelfth`,
# and a docstring underneath repeating that sentence in prose would be noise
# that goes stale. D102 and D103 are therefore off for test cases, while the
# modules, the classes and every helper in tests/support still carry docstrings,
# because those say why the test exists rather than what it asserts. The pattern
# is "tests/**" rather than "tests/*" so that it reaches the subdirectories.
"tests/**" = ["D102", "D103", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
disallow_any_explicit = true
warn_unreachable = true

# passlib publishes no type information and no stub package exists on PyPI, so
# the import is untyped. The two call sites in app/infrastructure/security.py
# wrap their results in str() and bool(), which is what stops the Any spreading
# past that module boundary.
[[tool.mypy.overrides]]
module = ["passlib.*"]
ignore_missing_imports = true

# disallow_any_explicit is left on everywhere else, and off in exactly the eight
# modules that declare pydantic models. The Any it objects to is not in this
# source. pydantic marks BaseModel with @dataclass_transform, and for every
# such class mypy synthesises a hidden "__mypy-replace" member whose keyword
# parameters are typed Any. The flag then reports that synthesised member
# against the class statement itself, so the only ways to satisfy it are to
# stop using pydantic or to switch the flag off for the file. Narrowing it to
# these eight modules keeps the check live across the domain, the application
# layer and the routers, which is where an Any written by hand would actually
# do damage.
[[tool.mypy.overrides]]
module = [
    "app.api.schemas",
    "app.api.catalogue_schemas",
    "app.api.reservation_schemas",
    "app.api.account_schemas",
    "app.api.customer_schemas",
    "app.api.hire_schemas",
    "app.config",
    "app.config_limits",
]
disallow_any_explicit = false
