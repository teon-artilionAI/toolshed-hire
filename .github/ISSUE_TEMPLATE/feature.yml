name: Feature or change
description: A piece of work that gets its own branch and pull request
labels: []
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What should be true when this is done, and who it is for.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: The acceptance criteria, as a checklist.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: input
    id: covers
    attributes:
      label: Covers
      description: Requirement, user story and business rule identifiers from the design document.
      placeholder: FR-05, US-11, BR-21
  - type: input
    id: screens
    attributes:
      label: Screens
      description: Screen identifiers this touches, if any.
      placeholder: SC-04, SC-07
  - type: input
    id: branch
    attributes:
      label: Branch
      description: The branch name, using this issue's number.
      placeholder: feature/123-short-name
