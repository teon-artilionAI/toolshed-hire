# Fast checks.
#
# These run on every push to every branch, so I find out within a few minutes
# whether a commit broke something. Nothing here needs a database or a browser.
# The slower checks that do live in ci-integration.yml and run on pull requests.
#
# Third party actions are pinned by commit SHA. The tag each SHA came from is in
# the comment beside it, and Dependabot keeps both up to date.

name: Fast checks

on:
  push:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  backend:
    name: Backend lint, types, boundaries and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # Every package, direct or indirect, comes from the hashed lock (C-37).
      # The project itself is installed on top with no dependencies of its own.
      - name: Install the backend and its development dependencies
        run: |
          pip install --require-hashes --requirement requirements-dev.txt
          pip install --no-deps --no-build-isolation --editable .

      - name: Lint
        run: ruff check .

      # The application is checked first, then the seed and provisioning tools,
      # which are run from this directory and are not part of the image.
      - name: Type check
        run: |
          mypy app
          mypy seed.py seeding seed_data scripts

      # The domain layer may not import from the layers around it. This is the
      # check that keeps that true as the code grows.
      - name: Check the layer import contract
        run: lint-imports

      - name: Run the tests that need no database
        run: pytest tests -m "not postgres"
        env:
          ENVIRONMENT: test

  # The lockfiles are compiled from pyproject.toml in the same base image the
  # Dockerfile pins, read from the Dockerfile so the two cannot drift apart.
  # A pin changed in pyproject.toml without the lockfiles compiled again, or a
  # lockfile edited by hand, fails here.
  lockfiles:
    name: Backend lockfiles match pyproject.toml
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compile the lockfiles again
        run: |
          base_image="$(grep -m 1 -oE 'python:3\.12-slim-bookworm@sha256:[0-9a-f]{64}' Dockerfile)"
          test -n "${base_image}" || { echo "No pinned base image found in the Dockerfile"; exit 1; }
          docker run --rm --volume "${PWD}:/src" --workdir /src "${base_image}" \
            sh scripts/compile-lockfiles.sh

      - name: Fail if they differ from what is committed
        run: |
          git diff --exit-code -- requirements.txt requirements-dev.txt || {
            echo "The lockfiles are out of date. Run scripts/compile-lockfiles.sh as its header describes and commit the result."
            exit 1
          }

  frontend:
    name: Frontend lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run unit and component tests
        run: npm run test

      # The wire types are generated from the API's OpenAPI document. This
      # fails when that document has changed and the types were not regenerated.
      - name: Check the generated API types are current
        run: npm run api:types:check

  # One job that always runs and reports a single result. Branch protection
  # requires this job, so a skipped or cancelled job above can never leave a
  # required check waiting forever.
  outcome:
    name: Fast checks outcome
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    needs: [secrets, backend, lockfiles, frontend]
    steps:
      - name: Fail unless every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "::error title=Fast checks failed::At least one job did not succeed."
              exit 1
            fi
          done
